[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostwatch"
version = "0.1.0"
description = "Standalone staleness checker for saved GhostSlice bundles and Packs: snapshot a project at bundle time, then report by file and symbol whether a saved bundle/.claude_context is still fresh"
readme = "PLAN.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ghost Developer Studio" }]
keywords = ["llm", "context", "ghostslice", "staleness", "agents"]
dependencies = []

[project.scripts]
ghostwatch = "ghostwatch.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
